name: Build MDK4 OpenWrt Filogic IPK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-filogic:
    name: Build MDK4 - OpenWrt 24.10.0 Filogic
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libncursesw5-dev \
            ncurses-term \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            zstd \
            xz-utils \
            file \
            binutils

      - name: Download OpenWrt 24.10.0 Filogic SDK
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euxo pipefail

          SDK="openwrt-sdk-24.10.0-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          BASE="https://downloads.openwrt.org/releases/24.10.0/targets/mediatek/filogic"

          echo "Downloading SDK: $SDK"

          wget \
            --https-only \
            --timeout=60 \
            --tries=5 \
            --retry-connrefused \
            --retry-on-http-error=408,429,500,502,503,504 \
            "$BASE/$SDK"

          wget \
            --https-only \
            --timeout=60 \
            --tries=5 \
            "$BASE/sha256sums"

          echo "Searching checksum for: $SDK"

          EXPECTED_SHA="$(
            awk -v sdk="$SDK" '
              {
                checksum = $1
                file = $2

                gsub(/\r/, "", checksum)
                gsub(/\r/, "", file)

                sub(/^\*/, "", file)
                sub(/^\.\/, "", file)

                count = split(file, parts, "/")
                basename = parts[count]

                if (basename == sdk) {
                  print checksum
                  exit
                }
              }
            ' sha256sums
          )"

          if [ -z "$EXPECTED_SHA" ]; then
            echo "ERROR: No checksum found for $SDK"
            echo
            echo "Available SDK files:"
            grep -E 'sdk.*\.(tar\.xz|tar\.zst|tar\.gz)$' sha256sums || true
            echo
            echo "Complete sha256sums file:"
            cat sha256sums
            exit 1
          fi

          echo "Checksum found: $EXPECTED_SHA"

          printf '%s  %s\n' "$EXPECTED_SHA" "$SDK" | sha256sum -c -

          tar --zstd -xf "$SDK"

          SDK_DIR="${SDK%.tar.zst}"
          SDK_PATH="$RUNNER_TEMP/$SDK_DIR"

          test -d "$SDK_PATH"
          test -f "$SDK_PATH/Makefile"

          echo "SDK_DIR=$SDK_PATH" >> "$GITHUB_ENV"

          echo "SDK directory: $SDK_PATH"
          ls -la "$SDK_PATH"

      - name: Prepare MDK4 package
        shell: bash
        run: |
          set -euxo pipefail

          test -n "${SDK_DIR:-}"
          test -d "$SDK_DIR"

          mkdir -p "$SDK_DIR/package/mdk4"

          cp -a package/mdk4/. "$SDK_DIR/package/mdk4/"

          echo "=== Copied package files ==="
          find "$SDK_DIR/package/mdk4" -maxdepth 4 -type f -print

          echo
          echo "=== MDK4 Makefile ==="
          sed -n '1,160p' "$SDK_DIR/package/mdk4/Makefile"

      - name: Update OpenWrt feeds
        working-directory: ${{ env.SDK_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure SDK non-interactively
        working-directory: ${{ env.SDK_DIR }}
        shell: bash
        env:
          TERM: xterm
          TERMINFO: /usr/share/terminfo
        run: |
          set -euxo pipefail

          export TERM=xterm
          export TERMINFO=/usr/share/terminfo

          # Create a default SDK configuration without an interactive terminal.
          yes "" | make defconfig

          test -f .config

          echo "=== Target configuration ==="
          grep -E \
            'CONFIG_TARGET_mediatek=y|CONFIG_TARGET_mediatek_filogic=y|CONFIG_ARCH=' \
            .config || true

      - name: Build MDK4 package
        working-directory: ${{ env.SDK_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          make package/mdk4/clean V=s || true
          make package/mdk4/compile V=s

      - name: Find generated IPK
        working-directory: ${{ env.SDK_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Generated IPK files ==="

          find bin/packages \
            -type f \
            -name 'mdk4_*.ipk' \
            -print

          IPK="$(find bin/packages -type f -name 'mdk4_*.ipk' | head -n 1)"

          if [ -z "$IPK" ]; then
            echo "ERROR: No MDK4 IPK was generated"
            exit 1
          fi

          test -f "$IPK"

          echo "IPK=$IPK" >> "$GITHUB_ENV"
          echo "Generated package: $IPK"

      - name: Verify package metadata
        working-directory: ${{ env.SDK_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          test -n "${IPK:-}"
          test -f "$IPK"

          echo "=== Package metadata ==="

          tar -xOf "$IPK" ./control.tar.gz \
            | tar -xzOf - ./control \
            | grep -E '^(Package|Version|Architecture|Depends):'

      - name: Verify MDK4 binary
        working-directory: ${{ env.SDK_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          test -n "${IPK:-}"
          test -f "$IPK"

          rm -rf "$RUNNER_TEMP/mdk4-check"
          mkdir -p "$RUNNER_TEMP/mdk4-check"

          tar -xOf "$IPK" ./data.tar.gz \
            | tar -xzOf - ./usr/sbin/mdk4 \
            > "$RUNNER_TEMP/mdk4-check/mdk4"

          test -s "$RUNNER_TEMP/mdk4-check/mdk4"

          echo "=== File information ==="
          file "$RUNNER_TEMP/mdk4-check/mdk4"

          echo
          echo "=== ELF information ==="
          readelf -h "$RUNNER_TEMP/mdk4-check/mdk4" \
            | grep -E 'Class|Machine|OS/ABI'

      - name: Upload Filogic IPK
        uses: actions/upload-artifact@v4
        with:
          name: mdk4-openwrt-24.10.0-filogic
          path: |
            ${{ env.SDK_DIR }}/bin/packages/**/*.ipk
          if-no-files-found: error
          retention-days: 30
